name: Sync Firestore transactions to repo

on:
  schedule:
    - cron: '*/10 * * * *' # 10분마다 (GitHub 스케줄 특성상 실제로는 몇 분 더 늦게 돌 수 있음)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/sync-transactions.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data/transactions.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/transactions.json
          git commit -m "폰/PC 입력분 자동 백업 (Firestore → transactions.json)"
          git push
