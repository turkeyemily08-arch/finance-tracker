<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/finance-tracker/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
    <title>finance-tracker</title>
    <script>
      // ① Service Worker 등록 (한 번 설치되면 이후 모든 방문에서 HTML을 항상 새로 가져옴)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js')
            .then(function (reg) {
              // 새 SW가 활성화되면 페이지 새로고침 → 최신 콘텐츠 보장
              reg.addEventListener('updatefound', function () {
                var newWorker = reg.installing;
                newWorker.addEventListener('statechange', function () {
                  if (newWorker.state === 'activated') {
                    window.location.reload();
                  }
                });
              });
            })
            .catch(function () {});
        });
      }

      // ② bfcache(뒤로/앞으로가기 캐시) 복원 감지 — 모바일에서 앱 전환 후 돌아오거나
      // 뒤로가기를 하면 브라우저가 페이지를 새로 불러오지 않고 얼려뒀던 화면을 그대로
      // 복원하는데, 이때는 이 <script> 자체가 재실행되지 않아 버전 체크(③)도 건너뛰고
      // 그 사이 새로 배포된 버전이 있어도 예전 화면이 계속 보임. persisted===true면
      // 무조건 새로고침해서 최신 HTML/JS/데이터를 다시 받도록 강제한다.
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) location.reload();
      });

      // ③ 버전 체크 (SW 미지원 환경용 백업)
      (function () {
        if (/[?&]v=/.test(location.search)) return;
        fetch('data/version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var prev = localStorage.getItem('_fv');
            localStorage.setItem('_fv', d.v);
            if (prev && prev !== d.v) {
              location.replace(location.pathname + '?v=' + d.v);
            }
          })
          .catch(function () {});
      })();
    </script>
    <script type="module" crossorigin src="/finance-tracker/assets/index-3TgxqtmJ.js"></script>
    <link rel="stylesheet" crossorigin href="/finance-tracker/assets/index-HTxqItTw.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
